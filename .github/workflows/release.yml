name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Test
        run: go test ./...

      - name: Get tag name
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile binaries
        run: |
          mkdir -p dist

          # windows/amd64
          GOOS=windows GOARCH=amd64 go build -o dist/siig-windows-amd64.exe .

          # darwin/amd64
          GOOS=darwin GOARCH=amd64 go build -o dist/siig-darwin-amd64 .

          # darwin/arm64
          GOOS=darwin GOARCH=arm64 go build -o dist/siig-darwin-arm64 .

          # linux/amd64
          GOOS=linux GOARCH=amd64 go build -o dist/siig-linux-amd64 .

          # windows/arm64
          GOOS=windows GOARCH=arm64 go build -o dist/siig-windows-arm64.exe .

          # linux/arm64
          GOOS=linux GOARCH=arm64 go build -o dist/siig-linux-arm64 .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/siig-windows-amd64.exe
            dist/siig-windows-arm64.exe
            dist/siig-darwin-amd64
            dist/siig-darwin-arm64
            dist/siig-linux-amd64
            dist/siig-linux-arm64
            dist/checksums.txt
